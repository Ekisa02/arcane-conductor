[package]
name = "arcane_conductor"
version = "0.1.0"
edition = "2021"
authors = ["Arcane Conductor Contributors"]
license = "MIT"

[dependencies]
actix-web = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
futures = "0.3"

[dev-dependencies]
actix-http-test = "3"
actix-rt = "2"
